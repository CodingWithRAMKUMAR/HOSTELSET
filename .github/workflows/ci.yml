name: HostelSet CI

on:
  push:
    branches:
      - main
      - test/automated-regression
      - test/migration-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostelset-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, E2E and Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
      API_RATE_LIMIT_SECRET: hostelset-ci-only-rate-limit-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Validate database migrations
        run: supabase db start

      - name: Run room change rent database tests
        run: docker exec -i supabase_db_hostelset psql -U postgres -d postgres -v ON_ERROR_STOP=1 -P pager=off < scripts/room-change-rent-db-tests.sql

      - name: Run regression tests
        run: npm test

      - name: Run reliability tests
        run: npm run test:reliability

      - name: Run public API security tests
        run: npm run test:api-security

      - name: Run fetch timeout tests
        run: npm run test:fetch-timeout

      - name: Run profile photo client tests
        run: npm run test:profile-photo-client

      - name: Run application URL tests
        run: npm run test:app-url

      - name: Run property slug tests
        run: npm run test:property-slug

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local Playwright tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
